services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nour
      POSTGRES_PASSWORD: nour_dev_password
      POSTGRES_DB: nour_meet
    volumes:
      - nour_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nour -d nour_meet"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://nour:nour_dev_password@postgres:5432/nour_meet?schema=public
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      SMS_MODE: ${SMS_MODE:-mock}
      DEV_OTP_CODE: ${DEV_OTP_CODE:-123456}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - nour_uploads_data:/app/apps/api/public/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run prisma:seed && npm run start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  nour_postgres_data:
  nour_uploads_data:
