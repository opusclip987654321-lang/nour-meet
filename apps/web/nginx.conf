server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Préparation mise en production : en-têtes de sécurité de base. Strict-Transport-Security n'est
  # utile qu'une fois le HTTPS réellement en place devant ce conteneur (reverse proxy / load
  # balancer) — l'ajouter ici ne coûte rien en HTTP simple, mais le HTTPS doit être configuré côté
  # infrastructure pour qu'il serve à quelque chose.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Un add_header dans un bloc location remplace ceux du serveur (règle nginx) : les en-têtes de
  # sécurité sont donc répétés ici pour les fichiers statiques.
  location /assets/ {
    error_page 404 @introuvable;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  # Photos et polices : noms stables mais contenu rarement modifié — un mois de cache navigateur.
  location ~* ^/(images|fonts)/ {
    error_page 404 @introuvable;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

  # index.html jamais mis en cache : après un déploiement, le navigateur récupère tout de suite la
  # liste des nouveaux fichiers au lieu de réclamer ceux de la version précédente (supprimés).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  # Routes de l'application (App.tsx) : index.html avec un statut 200. Une route ajoutée à App.tsx
  # sous un nouveau préfixe doit aussi l'être ici, sinon elle répond 404 (la page s'affiche quand même).
  location = / { rewrite ^ /index.html last; }
  location ~ ^/(events|concept|restaurateurs|blog|login|legal|pay|auth|bienvenue|notifications|dashboard|restaurant|scanner|admin)(/|$) {
    try_files $uri /index.html;
  }

  # Toute autre adresse inconnue (checklist SEO 2026-10-22, « soft 404 ») : la page 404 du site
  # s'affiche toujours, mais avec un vrai statut 404, sinon Google voit des milliers de fausses pages
  # identiques à l'accueil. Un fichier JS, une photo ou une police manquants gardent un 404 nu.
  error_page 404 /index.html;
  location / { try_files $uri =404; }
  location @introuvable { return 404; }
}
