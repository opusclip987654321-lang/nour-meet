# Compose de PRODUCTION — volontairement séparé de docker-compose.yml (dev/local) pour deux
# raisons critiques :
# 1. Le fichier de dev réamorce la base de données de démonstration à CHAQUE démarrage du
#    conteneur api (`npm run prisma:seed`) — lancer ça contre une base de production écraserait
#    ou dupliquerait de vraies données utilisateur. Ce fichier ne fait jamais tourner le seed.
# 2. Le fichier de dev expose PostgreSQL sur le réseau hôte (127.0.0.1:5434) pour du debug local ;
#    ici la base n'est accessible que sur le réseau interne Docker, jamais publiée.
#
# Utilisation : docker compose -f docker-compose.prod.yml up -d --build
# Toutes les valeurs sensibles viennent d'un fichier .env (non commité, voir .env.production.example)
# à côté de ce fichier — jamais de secret en clair ici.
#
# Le seul service exposé publiquement (ports 80/443) est "caddy", qui termine le HTTPS avec un
# certificat Let's Encrypt obtenu et renouvelé automatiquement, pour les trois domaines
# nourmeet.com / www.nourmeet.com / api.nourmeet.com. api et web ne sont accessibles que sur le
# réseau interne Docker (plus un accès de débogage limité à 127.0.0.1 sur le serveur lui-même).
# Cela suppose que les enregistrements DNS A de ces trois domaines pointent déjà vers l'IP
# publique de ce serveur AVANT le premier démarrage (sinon Caddy ne peut pas obtenir de certificat
# et réessaiera automatiquement).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-nour_meet}
    volumes:
      - nour_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nour} -d ${POSTGRES_DB:-nour_meet}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Jamais de "ports:" ici : uniquement accessible depuis les autres conteneurs de ce compose.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-nour_meet}?schema=public
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — jamais la valeur par défaut en production}
      SMS_MODE: ${SMS_MODE:?SMS_MODE=mock est interdit en production, voir env.ts}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN manquant (domaine réel du site, pas localhost)}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY manquant}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET manquant}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - nour_uploads_data:/app/apps/api/public/uploads
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Jamais de seed en production : uniquement les migrations déjà écrites et relues.
    command: sh -c "npx prisma migrate deploy && npm run start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL manquant (URL publique de l'API, ex. https://api.nourmeet.com)}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  # Reverse proxy + HTTPS automatique (Let's Encrypt). Seul service publié sur 80/443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN_WEB: ${DOMAIN_WEB:?DOMAIN_WEB manquant, ex. nourmeet.com}
      DOMAIN_API: ${DOMAIN_API:?DOMAIN_API manquant, ex. api.nourmeet.com}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant (adresse pour les alertes d'expiration de certificat Let's Encrypt)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  nour_postgres_data:
  nour_uploads_data:
  caddy_data:
  caddy_config:
